<!DOCTYPE html>

<body>
    <div class="logo">
        <img src="../imagen/LOGO2 ENTRE GRANOS.jpg" alt="EntreGranos"> <!-- Imagen del logo -->
    </div>
    <h1>Registro de productos</h1>
    <section>
        <form method="POST" action="registro.php" class="signin-form">
            
            <!-- Nombre -->
            <div class="form-element">
                <label for="nombre">Nombre</label>
                <input type="text" name="nombre" required />
            </div>

            <!-- Precio -->
            <div class="form-element">
                <label for="precio">Precio</label >
                <input type="number" step="0.01" id="precio" name="precio" required />
            </div>

            <!-- Descripción -->
            <div class="form-element">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" name="descripcion" required></textarea>
            </div>

            <!-- Imagen -->
            <div class="form-element">
                <label for="imagen">Imagen (ruta o URL)</label>
                <input type="text" id="imagen" name="imagen" required />
            </div>

            <!-- Botón -->
            <div class="form-element">
                <button type="submit" name="login" value="login">Registr Producto</button>
            </div>
        </form>
    </section>
