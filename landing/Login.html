<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EntreGranos</title>
    <link rel="stylesheet" href="Login.css"> <!-- Conectar con el archivo CSS -->
</head>
<body>

    <!-- ======= Barra de navegación ======= -->
    <div class="arriba">
        <span>Entre Granos</span> <!-- Nombre de la empresa/tienda -->
        <div>
            <a href="#">Información</a> <!-- Enlace a la página de información -->
            <a href="#">Contacto</a> <!-- Enlace a la página de contacto -->
            <a href="#">Carrito</a> <!-- Enlace al carrito de compras -->
            <a href="index.html" class="buton_inicio">Inicio</a> <!-- Enlace a la página principal -->
        </div>
    </div>

    <!-- ======= Logo de la empresa ======= -->
    <div class="logo">
        <img src="../imagen/LOGO2 ENTRE GRANOS.jpg" alt="Termo Briss"> <!-- Imagen del logo -->
    </div>

    <!-- ======= Formulario de inicio de sesión ======= -->
    <div class="iniciar_sesion">
        <h2>Iniciar Sesión</h2> <!-- Título del apartado-->
        <form action="Login.php" method="post"><!-- Enviar datos a login.php -->
            <div class="email_contr">
                <input type="email" name="email" placeholder="Correo electrónico" required> <!-- Campo para el correo -->
                <input type="password" name="contrasena" placeholder="Contraseña" required> <!-- Campo para la contraseña -->
                <button type="submit">Iniciar sesión</button> <!-- Botón para iniciar sesión -->
            </div>
        </form>
        <!-- Enlace para registrar una nueva cuenta -->
        <a href="Registro.html">
            <button type="button">Crear cuenta</button>
        </a>
    </div>

    <!-- ======= Sección de redes sociales ======= -->
    <div class="social_icons">
        <img src="../imagen/facebook.png" alt="Facebook"> <!--  Facebook -->
        <img src="../imagen/insta.png" alt="Instagram"> <!-- Instagram -->
        <img src="../imagen/youtube.png" alt="YouTube"> <!--  YouTube -->
    </div>

</body>
</html>
