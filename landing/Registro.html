<div class="registro">
    <h2>Registro</h2> <!-- Título -->
    <p>Regístrate con nosotros!</p> <!-- Subtítulo -->

    <form action="registro_usuario.php" method="post" class="registro-form">
        <div class="form-group">
            <div>
                <label for="primer_apellido"></label>
                <input type="text" name="primer_apellido" placeholder="Primer apellido">
            </div>
            <div>
                <label for="segundo_apellido"></label>
                <input type="text" name="segundo_apellido" id="segundo_apellido" placeholder="Segundo apellido">
            </div>
            <div>
                <label for="nombre"></label>
                <input type="text" name="nombre" placeholder="Nombre">
            </div>
        </div>

        <label for="email"></label>
        <input type="email" id="email" name="email" placeholder="Correo electronico">

        <label for="password"></label>
        <input type="password" id="password" name="contrasena" placeholder="Contraseña">

        <button type="submit">Registrarse</button> <!-- Botón para registrarse -->
    </form>
</div>
